name: Web

on:
    pull_request:
        paths:
            - "apps/web/**"
            - "packages/**"
            - "pnpm-lock.yaml"
            - "turbo.json"
            - ".github/workflows/web.yml"

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: hackkit
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d hackkit"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8.3.1

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web dependency graph
              run: pnpm exec turbo run build --filter=web^...

            - name: Sync plugin files
              working-directory: apps/web
              run: pnpm plugin:sync

            - name: Regenerate native schema files
              working-directory: apps/web
              run: |
                  pnpm schema:generate
                  pnpm auth:schema

            - name: Verify generated files are current
              run: |
                  changed="$(git status --porcelain -- apps/web/app/discord apps/web/app/invites/page.tsx apps/web/app/teams/page.tsx apps/web/app/hackkit-plugin-actions.ts apps/web/db/schema apps/web/hackkit.lock)"
                  if [ -n "$changed" ]; then
                      echo "$changed"
                      git diff -- apps/web/app/discord apps/web/app/invites/page.tsx apps/web/app/teams/page.tsx apps/web/app/hackkit-plugin-actions.ts apps/web/db/schema apps/web/hackkit.lock
                      exit 1
                  fi

            - name: Validate and apply migrations
              working-directory: apps/web
              env:
                  DATABASE_URL: file:.data/ci.db
              run: |
                  mkdir -p .data
                  pnpm drizzle-kit check
                  pnpm db:generate
                  changed="$(git status --porcelain -- db/migrations)"
                  if [ -n "$changed" ]; then
                      echo "$changed"
                      git diff -- db/migrations
                      exit 1
                  fi
                  pnpm db:migrate

            - name: Test database workflow isolation
              run: pnpm --filter web test:db-workflow

            - name: Validate PostgreSQL migration fixture
              run: |
                  pnpm --filter @hackkit/db-drizzle exec drizzle-kit check --config test-fixtures/postgres/drizzle.config.ts
                  pnpm --filter @hackkit/db-drizzle exec drizzle-kit generate --config test-fixtures/postgres/drizzle.config.ts
                  changed="$(git status --porcelain -- packages/db-drizzle/test-fixtures/postgres)"
                  if [ -n "$changed" ]; then
                      echo "$changed"
                      git diff -- packages/db-drizzle/test-fixtures/postgres
                      exit 1
                  fi

            - name: Package tests
              run: |
                  pnpm --filter web test
                  pnpm --filter @hackkit/core test
                  POSTGRES_TEST_URL=postgres://postgres:postgres@localhost:5432/hackkit pnpm --filter @hackkit/db-drizzle test
                  pnpm --filter @hackkit/cli test
                  pnpm --filter @hackkit/config test
                  pnpm --filter @hackkit/next test
                  pnpm --filter @hackkit/plugin-teams test
                  pnpm --filter @hackkit/plugin-discord test
                  pnpm --filter @hackkit/plugin-notifications-email test

            - name: Typecheck
              run: pnpm --filter web typecheck

            - name: Build web
              env:
                  DATABASE_URL: libsql://web-ci.turso.io
                  TURSO_AUTH_TOKEN: ci-token
                  NEXT_PUBLIC_APP_URL: https://web-ci.example.com
                  BETTER_AUTH_URL: https://web-ci.example.com
                  BETTER_AUTH_SECRET: ci-web-secret-that-is-at-least-32-characters
                  HACKKIT_BLOB_ADAPTER: s3
                  HACKKIT_S3_BUCKET: ci-bucket
                  HACKKIT_S3_REGION: auto
                  HACKKIT_S3_ENDPOINT: https://example.r2.cloudflarestorage.com
                  HACKKIT_S3_ACCESS_KEY_ID: ci-access-key
                  HACKKIT_S3_SECRET_ACCESS_KEY: ci-secret-key
                  DISCORD_GUILD_ID: ci-guild
                  DISCORD_BOT_API_URL: https://discord-bot-ci.example.com
                  DISCORD_INTERNAL_AUTH_KEY: ci-internal-auth-key
                  DISCORD_PARTICIPANT_ROLE_ID: ci-participant-role
              run: pnpm --filter web build
